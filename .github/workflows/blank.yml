name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 4.9
      - run: unzip -q EmberWraith-1.12.2-source.zip
      - run: cd emberwraith-mod && gradle setupDecompWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EmberWraith-jar
          path: emberwraith-mod/build/libs/*.jar
